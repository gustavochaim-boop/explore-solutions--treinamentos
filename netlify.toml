[build]
  command = "npm run build"
  publish = "dist"

# Redirecionamento SPA (Single Page Application)
# Garante que qualquer rota recarregada redirecione para o index.html sem erro 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeçalhos de segurança recomendados
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
