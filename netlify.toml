[build]
  command = "npm run build"
  publish = "dist"

# Redirecionamento SPA (Single Page Application)
# Garante que qualquer rota recarregada redirecione para o index.html sem erro 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-Control: Nunca cachear index.html para que novas atualizações no Netlify apareçam imediatamente
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Arquivos com hash gerados pelo Vite em /assets/ podem ser cacheados com segurança
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

